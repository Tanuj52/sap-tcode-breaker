[server]
enableStaticServing = true
maxUploadSize = 200
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#1a6640"
backgroundColor = "#f2eee3"
secondaryBackgroundColor = "#f7f3e9"
textColor = "#15211a"
borderColor = "#dcd3bf"
font = "Inter, ui-sans-serif, system-ui, sans-serif"
headingFont = "Fraunces, Georgia, serif"
codeFont = "JetBrains Mono, ui-monospace, Menlo, monospace"
baseFontSize = 14
baseRadius = "0.6rem"
buttonRadius = "0.55rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/inter.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fraunces.woff2"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "JetBrains Mono"
url = "app/static/jetbrains-mono.woff2"
weight = "100 800"
style = "normal"

[theme.sidebar]
backgroundColor = "#10241a"
secondaryBackgroundColor = "#1a3427"
textColor = "#eef2ea"
primaryColor = "#86d6a6"
borderColor = "#1a3427"
