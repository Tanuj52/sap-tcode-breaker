      ERDAT: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      VDATU: DATS(8) Valid from
      BDATU: DATS(8) Valid to
      LIFNR: CHAR(10) Vendor
      FLIFN: CHAR(1) Fixed vendor
