# Built-in SAP table knowledge - MM (material master extensions, stocks, purchasing, invoice verification, services, WM, QM, BOM, config).
version: 1

tables:

  # ---------------------------------------------------------------- Material master extensions
  MVKE:
    description: Sales data for material
    module: MM
    release: both
    key: [MANDT, MATNR, VKORG, VTWEG]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      VKORG: CHAR(4) Sales organization
      VTWEG: CHAR(2) Distribution channel
      LVORM: CHAR(1) Deletion flag (sales level)
      VMSTA: CHAR(2) Distribution-chain-specific material status
      VMSTD: DATS(8) Valid from (distribution-chain status)
      VERSG: CHAR(1) Material statistics group
      BONUS: CHAR(2) Volume rebate group
      PROVG: CHAR(2) Commission group
      SKTOF: CHAR(1) Cash discount indicator
      AUMNG: QUAN(13,3) Minimum order quantity
      LFMNG: QUAN(13,3) Minimum delivery quantity
      EFMNG: QUAN(13,3) Minimum make-to-order quantity
      SCMNG: QUAN(13,3) Delivery unit
      VRKME: UNIT(3) Sales unit
      MTPOS: CHAR(4) Item category group
      DWERK: CHAR(4) Delivering plant
      PRODH: CHAR(18) Product hierarchy
      KONDM: CHAR(2) Material pricing group
      KTGRM: CHAR(2) Account assignment group
      MVGR1: CHAR(3) Material group 1
      MVGR2: CHAR(3) Material group 2
      MVGR3: CHAR(3) Material group 3
      MVGR4: CHAR(3) Material group 4
      MVGR5: CHAR(3) Material group 5
      PMATN: CHAR(40) Pricing reference material

  MARM:
    description: Units of measure for material
    module: MM
    release: both
    key: [MANDT, MATNR, MEINH]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      MEINH: UNIT(3) Alternative unit of measure
      UMREZ: DEC(5,0) Numerator for conversion to base unit
      UMREN: DEC(5,0) Denominator for conversion to base unit
      EAN11: CHAR(18) EAN/UPC
      NUMTP: CHAR(2) EAN category
      LAENG: QUAN(13,3) ref=MEABM Length
      BREIT: QUAN(13,3) ref=MEABM Width
      HOEHE: QUAN(13,3) ref=MEABM Height
      MEABM: UNIT(3) Unit of dimension
      VOLUM: QUAN(13,3) ref=VOLEH Volume
      VOLEH: UNIT(3) Volume unit
      BRGEW: QUAN(13,3) ref=GEWEI Gross weight
      GEWEI: UNIT(3) Weight unit

  MEAN:
    description: International article numbers (EANs) for material
    module: MM
    release: both
    key: [MANDT, MATNR, MEINH, LFNUM]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      MEINH: UNIT(3) Unit of measure
      LFNUM: NUMC(5) Consecutive number
      EAN11: CHAR(18) EAN/UPC
      EANTP: CHAR(2) EAN category
      HPEAN: CHAR(1) Main EAN

  MLGN:
    description: Material data for each warehouse number
    module: MM
    release: both
    key: [MANDT, MATNR, LGNUM]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      LGNUM: CHAR(3) Warehouse number
      LVORM: CHAR(1) Deletion flag
      LGBKZ: CHAR(3) Storage section indicator
      LTKZE: CHAR(3) Storage type indicator for stock placement
      LTKZA: CHAR(3) Storage type indicator for stock removal
      LHMG1: QUAN(13,3) Loading equipment quantity
      LHME1: UNIT(3) Unit of measure for loading equipment quantity
      LETY1: CHAR(3) Storage unit type
      LVSME: UNIT(3) Warehouse management unit of measure
      BSSKZ: CHAR(1) Special movement indicator
      PLKPT: CHAR(3) Picking storage type

  MLGT:
    description: Material data for each storage type
    module: MM
    release: both
    key: [MANDT, MATNR, LGNUM, LGTYP]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      LGNUM: CHAR(3) Warehouse number
      LGTYP: CHAR(3) Storage type
      LVORM: CHAR(1) Deletion flag
      LGPLA: CHAR(10) Storage bin
      LPMAX: QUAN(13,3) Maximum bin quantity
      LPMIN: QUAN(13,3) Minimum bin quantity
      MAMNG: QUAN(13,3) Control quantity
      NSMNG: QUAN(13,3) Replenishment quantity
      RDMNG: QUAN(13,3) Rounding quantity
      KOBER: CHAR(3) Picking area

  MLAN:
    description: Tax classification for material
    module: MM
    release: both
    key: [MANDT, MATNR, ALAND]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      ALAND: CHAR(3) Departure country
      TAXM1: CHAR(1) Tax classification 1
      TAXM2: CHAR(1) Tax classification 2
      TAXM3: CHAR(1) Tax classification 3
      TAXM4: CHAR(1) Tax classification 4
      TAXIM: CHAR(1) Tax indicator for material (purchasing)

  # ---------------------------------------------------------------- Batches
  MCH1:
    description: Batches (cross-plant)
    module: MM
    release: both
    key: [MANDT, MATNR, CHARG]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      CHARG: CHAR(10) Batch
      LVORM: CHAR(1) Deletion flag
      ERSDA: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      AENAM: CHAR(12) Changed by
      LAEDA: DATS(8) Last change
      VERAB: DATS(8) Availability date
      VFDAT: DATS(8) Shelf life expiration date
      HSDAT: DATS(8) Date of manufacture
      QNDAT: DATS(8) Next inspection date
      LWEDT: DATS(8) Date of last goods receipt
      ZUSCH: CHAR(1) Batch status key
      ZUSTD: CHAR(1) Batch in restricted-use stock
      LIFNR: CHAR(10) Vendor
      LICHA: CHAR(15) Vendor batch
      HERKL: CHAR(3) Country of origin
      CUOBJ_BM: NUMC(18) Internal object number (batch classification)

  MCHA:
    description: Batches (plant level)
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, CHARG]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      CHARG: CHAR(10) Batch
      LVORM: CHAR(1) Deletion flag
      ERSDA: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      AENAM: CHAR(12) Changed by
      LAEDA: DATS(8) Last change
      BWTAR: CHAR(10) Valuation type
      VERAB: DATS(8) Availability date
      VFDAT: DATS(8) Shelf life expiration date
      HSDAT: DATS(8) Date of manufacture
      QNDAT: DATS(8) Next inspection date
      LWEDT: DATS(8) Date of last goods receipt
      ZUSTD: CHAR(1) Batch in restricted-use stock
      LIFNR: CHAR(10) Vendor
      LICHA: CHAR(15) Vendor batch
      HERKL: CHAR(3) Country of origin
      CUOBJ_BM: NUMC(18) Internal object number (batch classification)

  # ---------------------------------------------------------------- Stocks (S/4HANA reads quantities via compatibility CDS views)
  MCHB:
    description: Batch stocks
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, CHARG]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      LVORM: CHAR(1) Deletion flag
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      CLABS: QUAN(13,3) Valuated unrestricted-use stock
      CUMLM: QUAN(13,3) Stock in transfer
      CINSM: QUAN(13,3) Stock in quality inspection
      CEINM: QUAN(13,3) Restricted-use stock
      CSPEM: QUAN(13,3) Blocked stock
      CRETM: QUAN(13,3) Blocked stock returns
      CVMLA: QUAN(13,3) Valuated unrestricted-use stock in previous period

  MSKA:
    description: Sales order stock
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, CHARG, SOBKZ, VBELN, POSNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      SOBKZ: CHAR(1) Special stock indicator
      VBELN: CHAR(10) Sales order
      POSNR: NUMC(6) Sales order item
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      KALAB: QUAN(13,3) Valuated unrestricted-use stock
      KAINS: QUAN(13,3) Stock in quality inspection
      KASPE: QUAN(13,3) Blocked stock
      KAEIN: QUAN(13,3) Restricted-use stock

  MSKU:
    description: Special stocks with customer
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, CHARG, SOBKZ, KUNNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      CHARG: CHAR(10) Batch
      SOBKZ: CHAR(1) Special stock indicator
      KUNNR: CHAR(10) Customer
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      KULAB: QUAN(13,3) Valuated unrestricted-use stock
      KUINS: QUAN(13,3) Stock in quality inspection
      KUEIN: QUAN(13,3) Restricted-use stock

  MSLB:
    description: Special stocks with vendor
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, CHARG, SOBKZ, LIFNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      CHARG: CHAR(10) Batch
      SOBKZ: CHAR(1) Special stock indicator
      LIFNR: CHAR(10) Vendor
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      LBLAB: QUAN(13,3) Valuated unrestricted-use stock
      LBINS: QUAN(13,3) Stock in quality inspection
      LBEIN: QUAN(13,3) Restricted-use stock

  MKOL:
    description: Special stocks from vendor (consignment)
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, CHARG, SOBKZ, LIFNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      SOBKZ: CHAR(1) Special stock indicator
      LIFNR: CHAR(10) Vendor
      LVORM: CHAR(1) Deletion flag
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      SLABS: QUAN(13,3) Unrestricted-use consignment stock
      SINSM: QUAN(13,3) Consignment stock in quality inspection
      SEINM: QUAN(13,3) Restricted-use consignment stock
      SSPEM: QUAN(13,3) Blocked consignment stock

  MSPR:
    description: Project stock
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, CHARG, SOBKZ, PSPNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      SOBKZ: CHAR(1) Special stock indicator
      PSPNR: NUMC(8) WBS element
      ERSDA: DATS(8) Created on
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      PRLAB: QUAN(13,3) Valuated unrestricted-use stock
      PRINS: QUAN(13,3) Stock in quality inspection
      PRSPE: QUAN(13,3) Blocked stock
      PREIN: QUAN(13,3) Restricted-use stock

  MARDH:
    description: Storage location data for material - history
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, LFGJA, LFMON]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      LABST: QUAN(13,3) Valuated unrestricted-use stock
      UMLME: QUAN(13,3) Stock in transfer
      INSME: QUAN(13,3) Stock in quality inspection
      EINME: QUAN(13,3) Restricted-use stock
      SPEME: QUAN(13,3) Blocked stock
      RETME: QUAN(13,3) Blocked stock returns

  MCHBH:
    description: Batch stocks - history
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT, CHARG, LFGJA, LFMON]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      CLABS: QUAN(13,3) Valuated unrestricted-use stock
      CUMLM: QUAN(13,3) Stock in transfer
      CINSM: QUAN(13,3) Stock in quality inspection
      CEINM: QUAN(13,3) Restricted-use stock
      CSPEM: QUAN(13,3) Blocked stock
      CRETM: QUAN(13,3) Blocked stock returns

  MARCH:
    description: Plant data for material - history
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LFGJA, LFMON]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      UMLMC: QUAN(13,3) Stock in transfer (plant to plant)
