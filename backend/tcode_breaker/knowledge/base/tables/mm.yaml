    release: both
    key: [MANDT, BUKRS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      LFGJA: NUMC(4) Fiscal year of current period
      LFMON: NUMC(2) Current period
      VMGJA: NUMC(4) Fiscal year of previous period
      VMMON: NUMC(2) Previous period
      VJGJA: NUMC(4) Fiscal year of last period of previous year
      VJMON: NUMC(2) Last period of previous year
      XRUEM: CHAR(1) Allow posting to previous period
      XRUEV: CHAR(1) Disallow backposting

  # ---------------------------------------------------------------- Purchasing
  EINA:
    description: Purchasing info record - general data
    module: MM
    release: both
    key: [MANDT, INFNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      INFNR: CHAR(10) Purchasing info record
      MATNR: CHAR(40) Material number
      MATKL: CHAR(9) Material group
      LIFNR: CHAR(10) Vendor
      LOEKZ: CHAR(1) Deletion flag
      ERDAT: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      TXZ01: CHAR(40) Short text
      MEINS: UNIT(3) Order unit
      UMREZ: DEC(5,0) Numerator for conversion of order unit
      UMREN: DEC(5,0) Denominator for conversion of order unit
