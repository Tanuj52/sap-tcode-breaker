      MWSKZ: CHAR(2) Tax code
      INCO1: CHAR(3) Incoterms
      INCO2: CHAR(28) Incoterms (part 2)
      BSTAE: CHAR(4) Confirmation control key
      MEPRF: CHAR(1) Pricing date control
      EBELN: CHAR(10) Last purchasing document
      EBELP: NUMC(5) Last purchasing document item
