      VPROZ: DEC(3,1) Distribution percentage
      NETWR: CURR(13,2) Net order value
      SAKTO: CHAR(10) G/L account
      GSBER: CHAR(4) Business area
      KOSTL: CHAR(10) Cost center
      VBELN: CHAR(10) Sales order
