      EFFPR: CURR(11,2) ref=WAERS Effective price
      PEINH: DEC(5,0) Price unit
      BPRME: UNIT(3) Order price unit
      PRDAT: DATS(8) Price valid until
      MINBM: QUAN(13,3) Minimum order quantity
      NORBM: QUAN(13,3) Standard order quantity
      APLFZ: DEC(3,0) Planned delivery time (days)
      UEBTO: DEC(3,1) Overdelivery tolerance
