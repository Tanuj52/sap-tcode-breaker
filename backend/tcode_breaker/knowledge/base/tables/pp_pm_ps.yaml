    fields:
      MANDT: CLNT(3) Client
      TPLNR: CHAR(30) Functional location
      STRNO: CHAR(40) Functional location label
      FLTYP: CHAR(1) Functional location category
      TPLKZ: CHAR(5) Structure indicator
      TPLMA: CHAR(30) Superior functional location
      IWERK: CHAR(4) Maintenance planning plant
      INGRP: CHAR(3) Planner group
      EQART: CHAR(10) Type of technical object
      ILOAN: CHAR(12) Location and account assignment
      OBJNR: CHAR(22) Object number
      RBNR: CHAR(9) Catalog profile
      IEQUI: CHAR(1) Installation of equipment allowed
      HERST: CHAR(30) Manufacturer
      BAUJJ: CHAR(4) Construction year
      INBDT: DATS(8) Start-up date
      ERDAT: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      AEDAT: DATS(8) Changed on
      AENAM: CHAR(12) Changed by

  IFLOTX:
    description: Functional location short texts
    module: PM
    release: both
    key: [MANDT, TPLNR, SPRAS]
    fields_complete: false
    text_of: IFLOT
    fields:
      MANDT: CLNT(3) Client
      TPLNR: CHAR(30) Functional location
      SPRAS: LANG(1) Language key
      PLTXT: CHAR(40) Functional location description
      PLTXU: CHAR(40) Description in upper case
      KZLTX: CHAR(1) Long text exists

  ILOA:
    description: PM object location and account assignment
    module: PM
    release: both
    key: [MANDT, ILOAN]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      ILOAN: CHAR(12) Location and account assignment
      TPLNR: CHAR(30) Functional location
      SWERK: CHAR(4) Maintenance plant
      STORT: CHAR(10) Location of maintenance object
      MSGRP: CHAR(8) Room
      BEBER: CHAR(3) Plant section
      PPSID: NUMC(8) Production work center object ID
      ABCKZ: CHAR(1) ABC indicator
      EQFNR: CHAR(30) Sort field
      BUKRS: CHAR(4) Company code
      GSBER: CHAR(4) Business area
      KOKRS: CHAR(4) Controlling area
      KOSTL: CHAR(10) Cost center
      ANLNR: CHAR(12) Main asset number
      ANLUN: CHAR(4) Asset subnumber
      PROID: NUMC(8) WBS element
      DAUFN: CHAR(12) Standing order
      AUFNR: CHAR(12) Settlement order
      ADRNR: CHAR(10) Address number
      VKORG: CHAR(4) Sales organization
      VTWEG: CHAR(2) Distribution channel
      SPART: CHAR(2) Division

  AFIH:
    description: Maintenance order header
    module: PM
    release: both
    key: [MANDT, AUFNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      AUFNR: CHAR(12) Order
      ARTPR: CHAR(2) Priority type
      PRIOK: CHAR(1) Priority
      EQUNR: CHAR(18) Equipment
      BAUTL: CHAR(40) Assembly
      ILOAN: CHAR(12) Location and account assignment
      QMNUM: CHAR(12) Notification
      IWERK: CHAR(4) Maintenance planning plant
      INGPR: CHAR(3) Planner group
      GEWRK: NUMC(8) Main work center object ID
      ILART: CHAR(3) Maintenance activity type
      WARPL: CHAR(12) Maintenance plan
      WAPOS: CHAR(16) Maintenance item
      ANLZU: CHAR(1) System condition
      SERIALNR: CHAR(18) Serial number
      SERMAT: CHAR(40) Material of serial number
      REVNR: CHAR(8) Revision
      ADDAT: DATS(8) Reference date

  # ---------------------------------------------------------------- PM/QM notifications
  QMEL:
    description: Quality / maintenance notification header
    module: PM
    release: both
    key: [MANDT, QMNUM]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      QMNUM: CHAR(12) Notification
      QMART: CHAR(2) Notification type
      QMTXT: CHAR(40) Short text
      ARTPR: CHAR(2) Priority type
      PRIOK: CHAR(1) Priority
      ERNAM: CHAR(12) Created by
