    module: PM
    release: both
    key: [MANDT, EQUNR, SPRAS]
    fields_complete: false
    text_of: EQUI
    fields:
      MANDT: CLNT(3) Client
      EQUNR: CHAR(18) Equipment
      SPRAS: LANG(1) Language key
      EQKTX: CHAR(40) Equipment description
      EQKTU: CHAR(40) Equipment description in upper case
      KZLTX: CHAR(1) Long text exists

  EQUZ:
    description: Equipment time segment
    module: PM
    release: both
    key: [MANDT, EQUNR, DATBI, EQLFN]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      EQUNR: CHAR(18) Equipment
      DATBI: DATS(8) Valid to date
      EQLFN: NUMC(3) Consecutive numbering of time segments
      DATAB: DATS(8) Valid from date
      IWERK: CHAR(4) Maintenance planning plant
      INGRP: CHAR(3) Planner group
      GEWRK: NUMC(8) Main work center object ID
      HEQUI: CHAR(18) Superordinate equipment
      HEQNR: CHAR(4) Position in superordinate equipment
      TIDNR: CHAR(25) Technical identification number
      ILOAN: CHAR(12) Location and account assignment
      SUBMT: CHAR(40) Construction type
      RBNR: CHAR(9) Catalog profile
      ERDAT: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      AEDAT: DATS(8) Changed on
      AENAM: CHAR(12) Changed by

  IFLOT:
