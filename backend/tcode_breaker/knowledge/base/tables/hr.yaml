# Built-in SAP table knowledge - HCM personnel administration infotypes, time infotypes, org management and HR customizing.
version: 1
tables:

  # ---------------------------------------------------------------- PA infotypes (key: PERNR SUBTY OBJPS SPRPS ENDDA BEGDA SEQNR)
  PA0000:
    description: HR master record - infotype 0000 (Actions)
    module: HR
    release: both
    key: [MANDT, PERNR, SUBTY, OBJPS, SPRPS, ENDDA, BEGDA, SEQNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      PERNR: NUMC(8) Personnel number
      SUBTY: CHAR(4) Subtype
      OBJPS: CHAR(2) Object identification
      SPRPS: CHAR(1) Lock indicator for HR master data record
      ENDDA: DATS(8) End date
      BEGDA: DATS(8) Start date
      SEQNR: NUMC(3) Number of infotype record with same key
      AEDTM: DATS(8) Changed on
      UNAME: CHAR(12) Changed by
      MASSN: CHAR(2) Action type
      MASSG: CHAR(2) Reason for action
      STAT1: CHAR(1) Customer-specific status
      STAT2: CHAR(1) Employment status
      STAT3: CHAR(1) Special payment status

