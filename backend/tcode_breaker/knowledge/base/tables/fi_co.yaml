# Built-in SAP table knowledge - FI / CO / AA (general ledger, AR/AP, tax, payments, banks, assets, controlling).
version: 1

tables:

  # ---------------------------------------------------------------- FI secondary indexes
  BSAD:
    description: Customer cleared items (ECC; compatibility view in S/4HANA)
    module: FI
    release: ecc
    key: [MANDT, BUKRS, KUNNR, UMSKS, UMSKZ, AUGDT, AUGBL, ZUONR, GJAHR, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      KUNNR: CHAR(10) Customer number
      UMSKS: CHAR(1) Special G/L transaction type
      UMSKZ: CHAR(1) Special G/L indicator
      AUGDT: DATS(8) Clearing date
      AUGBL: CHAR(10) Clearing document
      ZUONR: CHAR(18) Assignment
      GJAHR: NUMC(4) Fiscal year
      BELNR: CHAR(10) Accounting document number
      BUZEI: NUMC(3) Line item
      BUDAT: DATS(8) Posting date
      BLDAT: DATS(8) Document date
      CPUDT: DATS(8) Entry date
      WAERS: CUKY(5) Currency
      XBLNR: CHAR(16) Reference document number
      BLART: CHAR(2) Document type
      MONAT: NUMC(2) Fiscal period
      BSCHL: CHAR(2) Posting key
      SHKZG: CHAR(1) Debit/credit indicator
      GSBER: CHAR(4) Business area
      MWSKZ: CHAR(2) Tax code
      DMBTR: CURR(13,2) Amount in local currency
      WRBTR: CURR(13,2) ref=WAERS Amount in document currency
      SGTXT: CHAR(50) Item text

  ANKA:
    description: Asset classes (general data)
    module: AA
    release: both
    key: [MANDT, ANLKL]
    fields_complete: false
    text_table: ANKT
    fields:
      MANDT: CLNT(3) Client
      ANLKL: CHAR(8) Asset class
      KTOGR: CHAR(8) Account determination

  ANKT:
    description: Asset class descriptions
    module: AA
    release: both
    key: [MANDT, SPRAS, ANLKL]
    fields_complete: false
    text_of: ANKA
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language key
      ANLKL: CHAR(8) Asset class
      TXK20: CHAR(20) Short text of asset class
      TXK50: CHAR(50) Asset class description

  ANLH:
    description: Main asset number
    module: AA
    release: both
    key: [MANDT, BUKRS, ANLN1]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      ANLN1: CHAR(12) Main asset number
      ANLHTXT: CHAR(50) Asset main number text

  # ---------------------------------------------------------------- Controlling documents and totals
  COEP:
    description: CO object line items (by period) (ECC; compatibility view in S/4HANA)
    module: CO
    release: ecc
    key: [MANDT, KOKRS, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KOKRS: CHAR(4) Controlling area
      BELNR: CHAR(10) Document number
      BUZEI: NUMC(3) Posting row
      PERIO: NUMC(3) Period
      GJAHR: NUMC(4) Fiscal year
      OBJNR: CHAR(22) Object number
      WRTTP: CHAR(2) Value type
      VERSN: CHAR(3) Version
      KSTAR: CHAR(10) Cost element
      VRGNG: CHAR(4) CO business transaction
      BEKNZ: CHAR(1) Debit/credit indicator
      TWAER: CUKY(5) Transaction currency
      OWAER: CUKY(5) Object currency
      WTGBTR: CURR(15,2) ref=TWAER Total value in transaction currency
      WOGBTR: CURR(15,2) ref=OWAER Total value in object currency
      WKGBTR: CURR(15,2) Total value in controlling area currency
      MEINH: UNIT(3) Unit of measure
      MEGBTR: QUAN(15,3) ref=MEINH Total quantity entered
      PAROB: CHAR(22) Partner object
      USPOB: CHAR(22) Source object
      SGTXT: CHAR(50) Segment text
      BUKRS: CHAR(4) Company code
      GSBER: CHAR(4) Business area
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      EBELN: CHAR(10) Purchasing document number
      EBELP: NUMC(5) Item of purchasing document

  COSP:
    description: CO object cost totals for external postings (ECC; compatibility view in S/4HANA)
    module: CO
    release: ecc
    key: [MANDT, LEDNR, OBJNR, GJAHR, WRTTP, VERSN, KSTAR, HRKFT, VRGNG, VBUND, PARGB, BEKNZ, TWAER, PERBL]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      LEDNR: CHAR(2) Ledger for controlling objects
      OBJNR: CHAR(22) Object number
      GJAHR: NUMC(4) Fiscal year
      WRTTP: CHAR(2) Value type
      VERSN: CHAR(3) Version
      KSTAR: CHAR(10) Cost element
      HRKFT: CHAR(14) Origin of costs (CO sub-key)
      VRGNG: CHAR(4) CO business transaction
      VBUND: CHAR(6) Trading partner
      PARGB: CHAR(4) Trading partner business area
      BEKNZ: CHAR(1) Debit/credit indicator
      TWAER: CUKY(5) Transaction currency
      PERBL: NUMC(3) Period block
      MEINH: UNIT(3) Unit of measure
      WKG001: CURR(15,2) Total value in controlling area currency period 01
      WKG002: CURR(15,2) Total value in controlling area currency period 02
      WKG003: CURR(15,2) Total value in controlling area currency period 03
      WKG004: CURR(15,2) Total value in controlling area currency period 04
      WKG005: CURR(15,2) Total value in controlling area currency period 05
      WKG006: CURR(15,2) Total value in controlling area currency period 06
      WKG007: CURR(15,2) Total value in controlling area currency period 07
      WKG008: CURR(15,2) Total value in controlling area currency period 08
      WKG009: CURR(15,2) Total value in controlling area currency period 09
      WKG010: CURR(15,2) Total value in controlling area currency period 10
      WKG011: CURR(15,2) Total value in controlling area currency period 11
      WKG012: CURR(15,2) Total value in controlling area currency period 12
      WKG013: CURR(15,2) Total value in controlling area currency period 13
      WKG014: CURR(15,2) Total value in controlling area currency period 14
      WKG015: CURR(15,2) Total value in controlling area currency period 15
      WKG016: CURR(15,2) Total value in controlling area currency period 16

  COSS:
    description: CO object cost totals for internal postings (ECC; compatibility view in S/4HANA)
    module: CO
    release: ecc
    key: [MANDT, LEDNR, OBJNR, GJAHR, WRTTP, VERSN, KSTAR, HRKFT, VRGNG, PAROB, USPOB, BEKNZ, TWAER, PERBL]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      LEDNR: CHAR(2) Ledger for controlling objects
      OBJNR: CHAR(22) Object number
      GJAHR: NUMC(4) Fiscal year
      WRTTP: CHAR(2) Value type
      VERSN: CHAR(3) Version
      KSTAR: CHAR(10) Cost element
      HRKFT: CHAR(14) Origin of costs (CO sub-key)
      VRGNG: CHAR(4) CO business transaction
      PAROB: CHAR(22) Partner object
      USPOB: CHAR(22) Source object
      BEKNZ: CHAR(1) Debit/credit indicator
      TWAER: CUKY(5) Transaction currency
      PERBL: NUMC(3) Period block
      MEINH: UNIT(3) Unit of measure
      WKG001: CURR(15,2) Total value in controlling area currency period 01
      WKG002: CURR(15,2) Total value in controlling area currency period 02
      WKG003: CURR(15,2) Total value in controlling area currency period 03
      WKG004: CURR(15,2) Total value in controlling area currency period 04
      WKG005: CURR(15,2) Total value in controlling area currency period 05
      WKG006: CURR(15,2) Total value in controlling area currency period 06
      WKG007: CURR(15,2) Total value in controlling area currency period 07
      WKG008: CURR(15,2) Total value in controlling area currency period 08
      WKG009: CURR(15,2) Total value in controlling area currency period 09
      WKG010: CURR(15,2) Total value in controlling area currency period 10
      WKG011: CURR(15,2) Total value in controlling area currency period 11
      WKG012: CURR(15,2) Total value in controlling area currency period 12
      WKG013: CURR(15,2) Total value in controlling area currency period 13
      WKG014: CURR(15,2) Total value in controlling area currency period 14
      WKG015: CURR(15,2) Total value in controlling area currency period 15
      WKG016: CURR(15,2) Total value in controlling area currency period 16

  COBK:
    description: CO object document header
    module: CO
    release: both
    key: [MANDT, KOKRS, BELNR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KOKRS: CHAR(4) Controlling area
      BELNR: CHAR(10) Document number
      GJAHR: NUMC(4) Fiscal year
      VERSN: CHAR(3) Version
      VRGNG: CHAR(4) CO business transaction
      PERAB: NUMC(3) From period
      PERBI: NUMC(3) To period
      BLDAT: DATS(8) Document date
      BUDAT: DATS(8) Posting date
      CPUDT: DATS(8) Entry date
      USNAM: CHAR(12) User name
      BLTXT: CHAR(50) Document header text
      REFBN: CHAR(10) Reference document number
      REFBK: CHAR(4) Company code of reference document
      REFGJ: NUMC(4) Fiscal year of reference document
      AWTYP: CHAR(5) Reference transaction
      AWORG: CHAR(10) Reference organizational units
      KWAER: CUKY(5) Controlling area currency

  # ---------------------------------------------------------------- Cost elements, activity types, profit centers
  CSKA:
    description: Cost elements (data dependent on chart of accounts)
    module: CO
    release: both
    key: [MANDT, KTOPL, KSTAR]
    fields_complete: false
    text_table: CSKU
    fields:
      MANDT: CLNT(3) Client
      KTOPL: CHAR(4) Chart of accounts
      KSTAR: CHAR(10) Cost element
      ERSDA: DATS(8) Created on
      USNAM: CHAR(12) Entered by

  CSKB:
    description: Cost elements (data dependent on controlling area)
    module: CO
    release: both
    key: [MANDT, KOKRS, KSTAR, DATBI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KOKRS: CHAR(4) Controlling area
      KSTAR: CHAR(10) Cost element
      DATBI: DATS(8) Valid to date
      DATAB: DATS(8) Valid-from date
      KATYP: CHAR(2) Cost element category
      ERSDA: DATS(8) Created on
      USNAM: CHAR(12) Entered by
      MGEFL: CHAR(1) Record quantity
      MSEHI: UNIT(3) Unit of measurement
      KOSTL: CHAR(10) Cost center (default account assignment)
      AUFNR: CHAR(12) Order number (default account assignment)

  CSKU:
    description: Cost element texts
    module: CO
    release: both
    key: [MANDT, SPRAS, KTOPL, KSTAR]
    fields_complete: false
    text_of: CSKA
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language key
      KTOPL: CHAR(4) Chart of accounts
      KSTAR: CHAR(10) Cost element
      KTEXT: CHAR(20) General name
      LTEXT: CHAR(40) Description

  CSLA:
    description: Activity master (activity types)
    module: CO
    release: both
    key: [MANDT, KOKRS, LSTAR, DATBI]
    fields_complete: false
    text_table: CSLT
    fields:
      MANDT: CLNT(3) Client
      KOKRS: CHAR(4) Controlling area
      LSTAR: CHAR(6) Activity type
      DATBI: DATS(8) Valid to date
      DATAB: DATS(8) Valid-from date
      ERSDA: DATS(8) Created on
      USNAM: CHAR(12) Entered by
      LEINH: UNIT(3) Activity unit
      LATYP: CHAR(1) Activity type category
      VKSTA: CHAR(10) Allocation cost element
      TARKZ: CHAR(3) Price indicator

  CSLT:
    description: Activity type texts
    module: CO
    release: both
    key: [MANDT, SPRAS, KOKRS, LSTAR, DATBI]
    fields_complete: false
    text_of: CSLA
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language key
      KOKRS: CHAR(4) Controlling area
      LSTAR: CHAR(6) Activity type
      DATBI: DATS(8) Valid to date
      KTEXT: CHAR(20) General name
      LTEXT: CHAR(40) Description

  CEPC:
    description: Profit center master data
    module: CO
    release: both
    key: [MANDT, PRCTR, DATBI, KOKRS]
    fields_complete: false
    text_table: CEPCT
    fields:
      MANDT: CLNT(3) Client
      PRCTR: CHAR(10) Profit center
      DATBI: DATS(8) Valid to date
      KOKRS: CHAR(4) Controlling area
      DATAB: DATS(8) Valid-from date
      ERSDA: DATS(8) Created on
      USNAM: CHAR(12) Entered by
      VERAK: CHAR(20) Person responsible for profit center
      VERAK_USER: CHAR(12) User responsible for the profit center
      WAERS: CUKY(5) Currency key
      ABTEI: CHAR(12) Department
      KHINR: CHAR(12) Profit center area (standard hierarchy)
      LOCK_IND: CHAR(1) Lock indicator
      SEGMENT: CHAR(10) Segment for segmental reporting
      NAME1: CHAR(35) Name 1
      LAND1: CHAR(3) Country key
      ORT01: CHAR(35) City
      PSTLZ: CHAR(10) Postal code
      REGIO: CHAR(3) Region

  CEPCT:
    description: Profit center texts
    module: CO
    release: both
    key: [MANDT, SPRAS, PRCTR, DATBI, KOKRS]
    fields_complete: false
    text_of: CEPC
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language key
      PRCTR: CHAR(10) Profit center
      DATBI: DATS(8) Valid to date
      KOKRS: CHAR(4) Controlling area
      KTEXT: CHAR(20) General name
      LTEXT: CHAR(40) Long text
      MCTXT: CHAR(20) Search term for matchcode search

  TKA01:
    description: Controlling areas
    module: CO
    release: both
    key: [MANDT, KOKRS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KOKRS: CHAR(4) Controlling area
      BEZEI: CHAR(25) Name of the controlling area
      WAERS: CUKY(5) Currency key
      KTOPL: CHAR(4) Chart of accounts
      LMONA: CHAR(2) Fiscal year variant
      KHINR: CHAR(12) Standard hierarchy for cost centers
      PHINR: CHAR(12) Standard hierarchy for profit centers
      ERKRS: CHAR(4) Operating concern

  TKA02:
    description: Controlling area assignment (company code / business area)
    module: CO
    release: both
    key: [MANDT, BUKRS, GSBER]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      GSBER: CHAR(4) Business area
      KOKRS: CHAR(4) Controlling area

  # ---------------------------------------------------------------- Sets (groups / hierarchies)
  SETHEADER:
    description: Set header and directory
    module: CO
    release: both
    key: [MANDT, SETCLASS, SUBCLASS, SETNAME]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      SETCLASS: CHAR(4) Set class
      SUBCLASS: CHAR(12) Organizational unit as set subclass
      SETNAME: CHAR(24) Set name
      SETTYPE: CHAR(1) Set type
      TABNAME: CHAR(30) Table name
      FIELDNAME: CHAR(30) Field name
      CREUSER: CHAR(12) Created by
      CREDATE: DATS(8) Created on
      UPDUSER: CHAR(12) Last changed by
      UPDDATE: DATS(8) Last changed on

  SETLEAF:
    description: Values in sets
    module: CO
    release: both
    key: [MANDT, SETCLASS, SUBCLASS, SETNAME, LINEID]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      SETCLASS: CHAR(4) Set class
      SUBCLASS: CHAR(12) Organizational unit as set subclass
      SETNAME: CHAR(24) Set name
      LINEID: CHAR(10) Identifies a line within a set
      VALSIGN: CHAR(1) Sign (inclusive/exclusive)
      VALOPTION: CHAR(2) Selection operator
      VALFROM: CHAR(24) From value
      VALTO: CHAR(24) To value

  SETNODE:
    description: Hierarchy structure (subsets of a set)
    module: CO
    release: both
    key: [MANDT, SETCLASS, SUBCLASS, SETNAME, LINEID]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      SETCLASS: CHAR(4) Set class
      SUBCLASS: CHAR(12) Organizational unit as set subclass
      SETNAME: CHAR(24) Set name
      LINEID: CHAR(10) Identifies a line within a set
      SUBSETCLS: CHAR(4) Set class of the subset
      SUBSETSCLS: CHAR(12) Subclass of the subset
      SUBSETNAME: CHAR(24) Name of the subset

  # ---------------------------------------------------------------- Electronic bank statement
  FEBKO:
    description: Electronic bank statement header records
    module: FI
    release: both
    key: [MANDT, ANWND, ABSND, AZIDT, EMKEY]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      ANWND: CHAR(4) Application
      ABSND: CHAR(35) Sender of statement
      AZIDT: CHAR(20) Statement identification
      EMKEY: CHAR(10) Statement recipient key
      KUKEY: CHAR(8) Short key (surrogate)
      BUKRS: CHAR(4) Company code
      HBKID: CHAR(5) House bank
      HKTID: CHAR(5) Account ID
      AZNUM: NUMC(5) Statement number
      AZDAT: DATS(8) Statement date
      WAERS: CUKY(5) Currency

  FEBEP:
    description: Electronic bank statement line items
    module: FI
    release: both
    key: [MANDT, KUKEY, ESNUM]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KUKEY: CHAR(8) Short key (surrogate)
      ESNUM: NUMC(5) Memo record number (line item number in bank statement)
      VALUT: DATS(8) Value date
      BUDAT: DATS(8) Posting date
      VGEXT: CHAR(27) External business transaction
      VGINT: CHAR(4) Posting rule
      EPVOZ: CHAR(1) Debit/credit sign
      KWBTR: CURR(13,2) Amount in account currency
      BELNR: CHAR(10) Document number
      CHECT: CHAR(13) Check number
      ZUONR: CHAR(18) Assignment

  # ---------------------------------------------------------------- Chart of accounts and currency configuration
  T004:
    description: Directory of charts of accounts
    module: FI
    release: both
    key: [MANDT, KTOPL]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KTOPL: CHAR(4) Chart of accounts
      DSPRA: LANG(1) Maintenance language
      MAXLS: NUMC(2) Length of G/L account number
      XSPER: CHAR(1) Blocked for posting
      KKTPL: CHAR(4) Group chart of accounts

  TCURV:
    description: Exchange rate types
    module: FI
    release: both
    key: [MANDT, KURST]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KURST: CHAR(4) Exchange rate type
      XINVR: CHAR(1) Inversion allowed
      BKUZU: CHAR(1) Buying rate at
      GKUZU: CHAR(1) Selling rate at
      BWAER: CUKY(5) Base currency
      XBWRL: CHAR(1) Variance using base currency allowed

  TCURF:
    description: Conversion factors for currency translation
    module: FI
    release: both
    key: [MANDT, KURST, FCURR, TCURR, GDATU]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      KURST: CHAR(4) Exchange rate type
      FCURR: CUKY(5) From currency
      TCURR: CUKY(5) To-currency
      GDATU: CHAR(8) Date as of which the entry is valid (inverted)
      FFACT: DEC(9,0) Ratio for the "from" currency units
      TFACT: DEC(9,0) Ratio for the "to" currency units

  TCURT:
    description: Currency code names
    module: FI
    release: both
    key: [MANDT, SPRAS, WAERS]
    fields_complete: false
    text_of: TCURC
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language key
      WAERS: CUKY(5) Currency key
      LTEXT: CHAR(40) Long text
      KTEXT: CHAR(15) Short text
      HKONT: CHAR(10) G/L account
      ZFBDT: DATS(8) Baseline date for due date calculation
      ZTERM: CHAR(4) Terms of payment key
      ZLSCH: CHAR(1) Payment method
      VBELN: CHAR(10) Billing document

  BSAK:
    description: Vendor cleared items (ECC; compatibility view in S/4HANA)
    module: FI
    release: ecc
    key: [MANDT, BUKRS, LIFNR, UMSKS, UMSKZ, AUGDT, AUGBL, ZUONR, GJAHR, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      LIFNR: CHAR(10) Vendor account number
      UMSKS: CHAR(1) Special G/L transaction type
      UMSKZ: CHAR(1) Special G/L indicator
      AUGDT: DATS(8) Clearing date
      AUGBL: CHAR(10) Clearing document
      ZUONR: CHAR(18) Assignment
      GJAHR: NUMC(4) Fiscal year
      BELNR: CHAR(10) Accounting document number
      BUZEI: NUMC(3) Line item
      BUDAT: DATS(8) Posting date
      BLDAT: DATS(8) Document date
      CPUDT: DATS(8) Entry date
      WAERS: CUKY(5) Currency
      XBLNR: CHAR(16) Reference document number
      BLART: CHAR(2) Document type
      MONAT: NUMC(2) Fiscal period
      BSCHL: CHAR(2) Posting key
      SHKZG: CHAR(1) Debit/credit indicator
      GSBER: CHAR(4) Business area
      MWSKZ: CHAR(2) Tax code
      DMBTR: CURR(13,2) Amount in local currency
      WRBTR: CURR(13,2) ref=WAERS Amount in document currency
      SGTXT: CHAR(50) Item text
      HKONT: CHAR(10) G/L account
      ZFBDT: DATS(8) Baseline date for due date calculation
      ZTERM: CHAR(4) Terms of payment key
      ZLSCH: CHAR(1) Payment method
      EBELN: CHAR(10) Purchasing document number
      EBELP: NUMC(5) Item of purchasing document

  BSIS:
    description: G/L account open items / items of non-open-item accounts (ECC; compatibility view in S/4HANA)
    module: FI
    release: ecc
    key: [MANDT, BUKRS, HKONT, AUGDT, AUGBL, ZUONR, GJAHR, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      HKONT: CHAR(10) G/L account
      AUGDT: DATS(8) Clearing date
      AUGBL: CHAR(10) Clearing document
      ZUONR: CHAR(18) Assignment
      GJAHR: NUMC(4) Fiscal year
      BELNR: CHAR(10) Accounting document number
      BUZEI: NUMC(3) Line item
      BUDAT: DATS(8) Posting date
      BLDAT: DATS(8) Document date
      CPUDT: DATS(8) Entry date
      WAERS: CUKY(5) Currency
      XBLNR: CHAR(16) Reference document number
      BLART: CHAR(2) Document type
      MONAT: NUMC(2) Fiscal period
      BSCHL: CHAR(2) Posting key
      SHKZG: CHAR(1) Debit/credit indicator
      GSBER: CHAR(4) Business area
      MWSKZ: CHAR(2) Tax code
      DMBTR: CURR(13,2) Amount in local currency
      WRBTR: CURR(13,2) ref=WAERS Amount in document currency
      SGTXT: CHAR(50) Item text
      KOSTL: CHAR(10) Cost center
      AUFNR: CHAR(12) Order number
      PRCTR: CHAR(10) Profit center

  BSAS:
    description: G/L account cleared items (ECC; compatibility view in S/4HANA)
    module: FI
    release: ecc
    key: [MANDT, BUKRS, HKONT, AUGDT, AUGBL, ZUONR, GJAHR, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      HKONT: CHAR(10) G/L account
      AUGDT: DATS(8) Clearing date
      AUGBL: CHAR(10) Clearing document
      ZUONR: CHAR(18) Assignment
      GJAHR: NUMC(4) Fiscal year
      BELNR: CHAR(10) Accounting document number
      BUZEI: NUMC(3) Line item
      BUDAT: DATS(8) Posting date
      BLDAT: DATS(8) Document date
      CPUDT: DATS(8) Entry date
      WAERS: CUKY(5) Currency
      XBLNR: CHAR(16) Reference document number
      BLART: CHAR(2) Document type
      MONAT: NUMC(2) Fiscal period
      BSCHL: CHAR(2) Posting key
      SHKZG: CHAR(1) Debit/credit indicator
      GSBER: CHAR(4) Business area
      MWSKZ: CHAR(2) Tax code
      DMBTR: CURR(13,2) Amount in local currency
      WRBTR: CURR(13,2) ref=WAERS Amount in document currency
      SGTXT: CHAR(50) Item text
      KOSTL: CHAR(10) Cost center
      AUFNR: CHAR(12) Order number
      PRCTR: CHAR(10) Profit center

  BSET:
    description: Tax data document segment
    module: FI
    release: both
    key: [MANDT, BUKRS, BELNR, GJAHR, BUZEI]
    fields_complete: false
