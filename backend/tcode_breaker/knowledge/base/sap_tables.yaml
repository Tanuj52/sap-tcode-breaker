      LIFNR: CHAR(10) Vendor
      LAND1: CHAR(3) Country
      NAME1: CHAR(35) Name
      ORT01: CHAR(35) City
      PSTLZ: CHAR(10) Postal code
      STRAS: CHAR(35) Street
      KTOKK: CHAR(4) Account group
      LOEVM: CHAR(1) Deletion flag
      SPERR: CHAR(1) Posting block
      STCD1: CHAR(16) Tax number 1

  LFB1:
    description: Vendor master (company code)
    module: FI
    release: both
    key: [MANDT, LIFNR, BUKRS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      LIFNR: CHAR(10) Vendor
      BUKRS: CHAR(4) Company code
      AKONT: CHAR(10) Reconciliation account
      ZTERM: CHAR(4) Payment terms
      LOEVM: CHAR(1) Deletion flag

  # ---------------------------------------------------------------- SD
