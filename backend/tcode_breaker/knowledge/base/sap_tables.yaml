    module: MM
    release: both
    key: [MANDT, EBELN, EBELP, ZEKKN, VGABE, GJAHR, BELNR, BUZEI]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      EBELN: CHAR(10) Purchasing document
      EBELP: NUMC(5) Item
      ZEKKN: NUMC(2) Account assignment sequence
      VGABE: CHAR(1) Transaction/event type (1 = GR, 2 = IR)
      GJAHR: NUMC(4) Material document year
      BELNR: CHAR(10) Material/invoice document
      BUZEI: NUMC(4) Item
      BWART: CHAR(3) Movement type
      BUDAT: DATS(8) Posting date
      MENGE: QUAN(13,3) Quantity
      DMBTR: CURR(13,2) Amount in local currency
      SHKZG: CHAR(1) Debit/credit indicator

  EBAN:
