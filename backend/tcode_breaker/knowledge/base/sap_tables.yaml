# Built-in SAP table knowledge for tcode-breaker.
#
# Field spec format:  TYPE(len[,dec]) [ref=FIELD] Description
#   TYPE is the DDIC data type (CHAR, NUMC, DATS, TIMS, CURR, QUAN, DEC, INT1/2/4/8, CUKY, UNIT, LANG, CLNT, FLTP, STRG, RAW)
#   ref= names the currency/unit reference field for CURR/QUAN fields.
#
# fields_complete: true  -> every DB field is listed; unknown columns are errors.
# fields_complete: false -> only commonly used fields are listed; unknown columns are reported as "unverified".
# release: ecc | s4 | both   (where the table physically exists)
#
# Client packs (knowledge-packs/<client>/ddic/DD03L.csv) override and extend this file.
version: 1

tables:

  # ---------------------------------------------------------------- SFLIGHT demo model (BC)
  SCARR:
    description: Airline
    module: BC
    release: both
    key: [MANDT, CARRID]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      CARRID: CHAR(3) Airline code
      CARRNAME: CHAR(20) Airline name
      CURRCODE: CUKY(5) Local currency of airline
      URL: CHAR(255) Airline URL

  SPFLI:
    description: Flight schedule (connections)
    module: BC
    release: both
    key: [MANDT, CARRID, CONNID]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      CARRID: CHAR(3) Airline code
      CONNID: NUMC(4) Flight connection number
      COUNTRYFR: CHAR(3) Country of departure
      CITYFROM: CHAR(20) Departure city
      AIRPFROM: CHAR(3) Departure airport
      COUNTRYTO: CHAR(3) Arrival country
      CITYTO: CHAR(20) Arrival city
      AIRPTO: CHAR(3) Destination airport
      FLTIME: INT4(10) Flight time (minutes)
      DEPTIME: TIMS(6) Departure time
      ARRTIME: TIMS(6) Arrival time
      DISTANCE: QUAN(9,4) ref=DISTID Distance
      DISTID: UNIT(3) Distance unit
      FLTYPE: CHAR(1) Charter flag
      PERIOD: INT1(3) Arrival n day(s) later

  SFLIGHT:
    description: Flights
    module: BC
    release: both
    key: [MANDT, CARRID, CONNID, FLDATE]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      CARRID: CHAR(3) Airline code
      CONNID: NUMC(4) Flight connection number
      FLDATE: DATS(8) Flight date
      PRICE: CURR(15,2) ref=CURRENCY Airfare
      CURRENCY: CUKY(5) Local currency of airline
      PLANETYPE: CHAR(10) Aircraft type
      SEATSMAX: INT4(10) Maximum capacity economy
      SEATSOCC: INT4(10) Occupied seats economy
      PAYMENTSUM: CURR(17,2) ref=CURRENCY Total of current bookings
      SEATSMAX_B: INT4(10) Maximum capacity business
      SEATSOCC_B: INT4(10) Occupied seats business
      SEATSMAX_F: INT4(10) Maximum capacity first
      SEATSOCC_F: INT4(10) Occupied seats first

  SBOOK:
    description: Single flight booking
    module: BC
    release: both
    key: [MANDT, CARRID, CONNID, FLDATE, BOOKID]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      CARRID: CHAR(3) Airline code
      CONNID: NUMC(4) Flight connection number
      FLDATE: DATS(8) Flight date
      BOOKID: NUMC(8) Booking number
      CUSTOMID: NUMC(8) Customer number
      CUSTTYPE: CHAR(1) Customer type
      SMOKER: CHAR(1) Smoker
      LUGGWEIGHT: QUAN(8,4) ref=WUNIT Luggage weight
      WUNIT: UNIT(3) Weight unit
      INVOICE: CHAR(1) Invoice flag
      CLASS: CHAR(1) Flight class (F/C/Y)
      FORCURAM: CURR(15,2) ref=FORCURKEY Price in foreign currency
      FORCURKEY: CUKY(5) Payment currency
      LOCCURAM: CURR(15,2) ref=LOCCURKEY Price in local currency
      LOCCURKEY: CUKY(5) Local currency of airline
      ORDER_DATE: DATS(8) Booking date
      COUNTER: NUMC(8) Sales office
      AGENCYNUM: NUMC(8) Travel agency number
      CANCELLED: CHAR(1) Cancellation flag
      RESERVED: CHAR(1) Reservation flag
      PASSNAME: CHAR(25) Passenger name
      PASSFORM: CHAR(15) Form of address
      PASSBIRTH: DATS(8) Date of birth of passenger

  SCUSTOM:
    description: Flight customers
    module: BC
    release: both
    key: [MANDT, ID]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      ID: NUMC(8) Customer number
      NAME: CHAR(25) Customer name
      FORM: CHAR(15) Form of address
      STREET: CHAR(30) Street
      POSTBOX: CHAR(10) PO box
      POSTCODE: CHAR(10) Postal code
      CITY: CHAR(25) City
      COUNTRY: CHAR(3) Country
      REGION: CHAR(3) Region
      TELEPHONE: CHAR(30) Telephone
      CUSTTYPE: CHAR(1) Customer type
      DISCOUNT: NUMC(3) Discount rate (percent)
      LANGU: LANG(1) Language
      EMAIL: CHAR(40) E-mail address
      WEBUSER: CHAR(25) Web user

  # ---------------------------------------------------------------- Cross-application / config
  T001:
    description: Company codes
    module: FI
    release: both
    key: [MANDT, BUKRS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BUKRS: CHAR(4) Company code
      BUTXT: CHAR(25) Company name
      ORT01: CHAR(25) City
      LAND1: CHAR(3) Country
      WAERS: CUKY(5) Currency
      SPRAS: LANG(1) Language
      KTOPL: CHAR(4) Chart of accounts
      PERIV: CHAR(2) Fiscal year variant

  T001W:
    description: Plants / branches
    module: MM
    release: both
    key: [MANDT, WERKS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      WERKS: CHAR(4) Plant
      NAME1: CHAR(30) Plant name
      BWKEY: CHAR(4) Valuation area
      KUNNR: CHAR(10) Customer number of plant
      LIFNR: CHAR(10) Vendor number of plant
      LAND1: CHAR(3) Country
      ORT01: CHAR(25) City
      VKORG: CHAR(4) Sales organization

  T001L:
    description: Storage locations
    module: MM
    release: both
    key: [MANDT, WERKS, LGORT]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      LGOBE: CHAR(16) Storage location description

  TCURR:
    description: Exchange rates
    module: BC
    release: both
    key: [MANDT, KURST, FCURR, TCURR, GDATU]
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      KURST: CHAR(4) Exchange rate type
      FCURR: CUKY(5) From currency
      TCURR: CUKY(5) To currency
      GDATU: CHAR(8) Valid from (inverted date 99999999 - YYYYMMDD)
      UKURS: DEC(9,5) Exchange rate
      FFACT: DEC(9,0) Ratio from-currency units
      TFACT: DEC(9,0) Ratio to-currency units

  TCURX:
    description: Decimal places in currencies
    module: BC
    release: both
    key: [CURRKEY]
    fields_complete: true
    fields:
      CURRKEY: CUKY(5) Currency key
      CURRDEC: INT1(3) Number of decimal places

  TCURC:
    description: Currency codes
    module: BC
    release: both
    key: [MANDT, WAERS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      WAERS: CUKY(5) Currency key
      ISOCD: CHAR(3) ISO currency code

  T006A:
    description: Units of measure texts
    module: BC
    release: both
    key: [MANDT, SPRAS, MSEHI]
    text_of: T006
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      SPRAS: LANG(1) Language
      MSEHI: UNIT(3) Internal unit of measure
      MSEH3: CHAR(3) External unit (commercial)
      MSEHT: CHAR(10) Unit text
      MSEHL: CHAR(30) Unit long text

  # ---------------------------------------------------------------- MM
  MARA:
    description: General material data
    module: MM
    release: both
    key: [MANDT, MATNR]
    text_table: MAKT
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number (18 in ECC)
      ERSDA: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      LAEDA: DATS(8) Last change
      MTART: CHAR(4) Material type
      MBRSH: CHAR(1) Industry sector
      MATKL: CHAR(9) Material group
      MEINS: UNIT(3) Base unit of measure
      BRGEW: QUAN(13,3) ref=GEWEI Gross weight
      NTGEW: QUAN(13,3) ref=GEWEI Net weight
      GEWEI: UNIT(3) Weight unit
      LVORM: CHAR(1) Deletion flag (client level)
      SPART: CHAR(2) Division
      PRDHA: CHAR(18) Product hierarchy

  MAKT:
    description: Material descriptions
    module: MM
    release: both
    key: [MANDT, MATNR, SPRAS]
    text_of: MARA
    fields_complete: true
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      SPRAS: LANG(1) Language
      MAKTX: CHAR(40) Material description
      MAKTG: CHAR(40) Material description (upper case)

  MARC:
    description: Plant data for material
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LVORM: CHAR(1) Deletion flag (plant level)
      MMSTA: CHAR(2) Plant-specific material status
      EKGRP: CHAR(3) Purchasing group
      DISMM: CHAR(2) MRP type
      DISPO: CHAR(3) MRP controller
      BESKZ: CHAR(1) Procurement type
      PLIFZ: DEC(3,0) Planned delivery time (days)
      MINBE: QUAN(13,3) Reorder point
      EISBE: QUAN(13,3) Safety stock
      PRCTR: CHAR(10) Profit center

  MARD:
    description: Storage location data for material
    module: MM
    release: both
    key: [MANDT, MATNR, WERKS, LGORT]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      LABST: QUAN(13,3) Valuated unrestricted-use stock
      INSME: QUAN(13,3) Stock in quality inspection
      SPEME: QUAN(13,3) Blocked stock
      LVORM: CHAR(1) Deletion flag

  MBEW:
