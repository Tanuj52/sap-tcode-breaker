      LBKUM: QUAN(13,3) Total valuated stock
      SALK3: CURR(13,2) Value of total valuated stock
      VPRSV: CHAR(1) Price control indicator
      VERPR: CURR(11,2) Moving average price
      STPRS: CURR(11,2) Standard price
      PEINH: DEC(5,0) Price unit

  MKPF:
