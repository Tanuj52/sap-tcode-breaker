    module: MM
    release: both
    key: [MANDT, BANFN, BNFPO]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      BANFN: CHAR(10) Purchase requisition
      BNFPO: NUMC(5) Item
      BSART: CHAR(4) Document type
      LOEKZ: CHAR(1) Deletion indicator
      MATNR: CHAR(40) Material
      WERKS: CHAR(4) Plant
      MENGE: QUAN(13,3) Quantity
      MEINS: UNIT(3) Unit
      BADAT: DATS(8) Requisition date
      EBELN: CHAR(10) Purchase order
      EBELP: NUMC(5) PO item

  LFA1:
    description: Vendor master (general); synchronized with Business Partner in S/4HANA
    module: MM
    release: both
    key: [MANDT, LIFNR]
    fields_complete: false
