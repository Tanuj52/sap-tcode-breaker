    module: MM
    release: ecc
    key: [MANDT, MBLNR, MJAHR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MBLNR: CHAR(10) Material document number
      MJAHR: NUMC(4) Material document year
      VGART: CHAR(2) Transaction/event type
      BLART: CHAR(2) Document type
      BLDAT: DATS(8) Document date
      BUDAT: DATS(8) Posting date
      CPUDT: DATS(8) Entry date
      USNAM: CHAR(12) User name
      XBLNR: CHAR(16) Reference document
      BKTXT: CHAR(25) Document header text

  MSEG:
    description: Material document item (ECC; compatibility view over MATDOC in S/4HANA)
    module: MM
    release: ecc
    key: [MANDT, MBLNR, MJAHR, ZEILE]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MBLNR: CHAR(10) Material document number
      MJAHR: NUMC(4) Material document year
      ZEILE: NUMC(4) Item in material document
      BWART: CHAR(3) Movement type
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      LIFNR: CHAR(10) Vendor
      KUNNR: CHAR(10) Customer
      SHKZG: CHAR(1) Debit/credit indicator (S/H)
      WAERS: CUKY(5) Currency
      DMBTR: CURR(13,2) ref=WAERS Amount in local currency
      MENGE: QUAN(13,3) ref=MEINS Quantity
      MEINS: UNIT(3) Base unit of measure
      EBELN: CHAR(10) Purchase order
      EBELP: NUMC(5) Purchase order item
      KOSTL: CHAR(10) Cost center
      AUFNR: CHAR(12) Order number

  MATDOC:
    description: Material documents (S/4HANA universal table for goods movements)
    module: MM
    release: s4
    key: [MANDT, MBLNR, MJAHR, ZEILE]
    key_note: Logical key shown; the technical primary key uses KEY1..KEY6.
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      MBLNR: CHAR(10) Material document number
      MJAHR: NUMC(4) Material document year
      ZEILE: NUMC(4) Item in material document
      RECORD_TYPE: CHAR(4) Record type (MDOC = material document)
      VGART: CHAR(2) Transaction/event type
      BLART: CHAR(2) Document type
      BLDAT: DATS(8) Document date
      BUDAT: DATS(8) Posting date
      CPUDT: DATS(8) Entry date
      USNAM: CHAR(12) User name
      XBLNR: CHAR(16) Reference document
      BKTXT: CHAR(25) Document header text
      BWART: CHAR(3) Movement type
      MATNR: CHAR(40) Material number
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      CHARG: CHAR(10) Batch
      LIFNR: CHAR(10) Vendor
      KUNNR: CHAR(10) Customer
      SHKZG: CHAR(1) Debit/credit indicator (S/H)
      WAERS: CUKY(5) Currency
      DMBTR: CURR(13,2) ref=WAERS Amount in local currency
      MENGE: QUAN(13,3) ref=MEINS Quantity
      MEINS: UNIT(3) Base unit of measure
      EBELN: CHAR(10) Purchase order
      EBELP: NUMC(5) Purchase order item
      KOSTL: CHAR(10) Cost center
      AUFNR: CHAR(12) Order number

  EKKO:
    description: Purchasing document header
    module: MM
    release: both
    key: [MANDT, EBELN]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      EBELN: CHAR(10) Purchasing document
      BUKRS: CHAR(4) Company code
      BSTYP: CHAR(1) Document category
      BSART: CHAR(4) Document type
      LOEKZ: CHAR(1) Deletion indicator
      AEDAT: DATS(8) Created on
      ERNAM: CHAR(12) Created by
      LIFNR: CHAR(10) Vendor
      ZTERM: CHAR(4) Payment terms
      EKORG: CHAR(4) Purchasing organization
      EKGRP: CHAR(3) Purchasing group
      WAERS: CUKY(5) Currency
      BEDAT: DATS(8) Document date
      FRGKE: CHAR(1) Release indicator

  EKPO:
    description: Purchasing document item
    module: MM
    release: both
    key: [MANDT, EBELN, EBELP]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      EBELN: CHAR(10) Purchasing document
      EBELP: NUMC(5) Item
      LOEKZ: CHAR(1) Deletion indicator
      TXZ01: CHAR(40) Short text
      MATNR: CHAR(40) Material
      WERKS: CHAR(4) Plant
      LGORT: CHAR(4) Storage location
      MATKL: CHAR(9) Material group
      MENGE: QUAN(13,3) ref=MEINS Order quantity
      MEINS: UNIT(3) Order unit
      NETPR: CURR(11,2) Net price
      PEINH: DEC(5,0) Price unit
      NETWR: CURR(13,2) Net order value
      ELIKZ: CHAR(1) Delivery completed
      KNTTP: CHAR(1) Account assignment category
      PSTYP: CHAR(1) Item category

  EKET:
    description: Scheduling agreement / PO schedule lines
    module: MM
    release: both
    key: [MANDT, EBELN, EBELP, ETENR]
    fields_complete: false
    fields:
      MANDT: CLNT(3) Client
      EBELN: CHAR(10) Purchasing document
      EBELP: NUMC(5) Item
      ETENR: NUMC(4) Schedule line
      EINDT: DATS(8) Delivery date
      MENGE: QUAN(13,3) Scheduled quantity
      WEMNG: QUAN(13,3) Quantity of goods received

  EKBE:
